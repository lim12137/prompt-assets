name: Publish Images

on:
  workflow_dispatch:
  push:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set owner (lowercase)
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner_lc }}/prompt-assets-web:latest

      - name: Copy postgres 16-alpine manifest list to GHCR
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ steps.vars.outputs.owner_lc }}/prompt-assets-postgres:16-alpine \
            docker.io/library/postgres:16-alpine
