  <text x="400" y="814" class="section">设计要点</text>
  <text x="400" y="844" class="body">1. 页面主体继续保持原有“公司提示词库”的信息结构：页头、左侧分类、右侧搜索与内容卡片。</text>
  <text x="400" y="872" class="body">2. 新增的 AI工具 区块只放在左侧分类下方，并压低层级，表现成轻文本清单，不做按钮组、不做大卡片。</text>
  <text x="400" y="900" class="body">3. 每个工具链接单行呈现，搭配很小的外链提示符号 ↗，语义上更像配置项扩展，而不是新功能模块入口。</text>
  <text x="400" y="928" class="body">4. 底部的“更多...”继续保持弱提示，暗示后续可扩展，但不抢占首页主任务“找提示词、看提示词、复制提示词”。</text>

